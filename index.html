<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Market Vally</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#071426;
  color:white;
}

header{
  background:#0d2038;
  padding:18px 20px;
  font-size:25px;
  font-weight:bold;
}

header span{
  color:#f5b400;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

h1{
  font-size:30px;
}

.subtitle{
  color:#9fb0c5;
}

.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin:25px 0;
}

.card{
  background:#112642;
  padding:20px;
  border-radius:12px;
  border:1px solid #1e3b60;
}

.card h3{
  margin-top:0;
}

.value{
  font-size:24px;
  color:#35d39b;
  font-weight:bold;
}

.buttons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:25px;
}

button{
  background:#112642;
  color:white;
  border:1px solid #315174;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
}

button:hover{
  background:#1c3c60;
}

.news{
  background:#112642;
  margin:12px 0;
  padding:17px;
  border-radius:10px;
  border-left:4px solid #f5b400;
}

.news a{
  color:white;
  text-decoration:none;
  font-size:18px;
  font-weight:bold;
}

.news p{
  color:#aab8c8;
  margin-bottom:0;
}

.loading{
  color:#f5b400;
}

footer{
  text-align:center;
  color:#75869b;
  padding:40px;
}

@media(max-width:700px){
  .cards{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  Market <span>Vally</span>
</header>

<div class="container">

<h1>🇮🇳 India • 🇺🇸 America • 🥇 Gold</h1>

<p class="subtitle">
India, America, Gold aur Stock Market ki important news ek jagah.
</p>

<div class="cards">

<div class="card">
<h3>🥇 GOLD</h3>
<div class="value">Live Soon</div>
<p>Gold price</p>
</div>

<div class="card">
<h3>💵 USD / INR</h3>
<div class="value">Live Soon</div>
<p>Dollar rate</p>
</div>

<div class="card">
<h3>📈 NIFTY 50</h3>
<div class="value">Live Soon</div>
<p>Indian market</p>
</div>

</div>

<div class="buttons">
<button onclick="loadNews('India')">🇮🇳 India</button>
<button onclick="loadNews('United States')">🇺🇸 America</button>
<button onclick="loadNews('Gold')">🥇 Gold</button>
<button onclick="loadNews('Stock Market')">📈 Markets</button>
</div>

<h2>📰 Latest News</h2>

<div id="news">
<p class="loading">News load ho rahi hai...</p>
</div>

</div>

<footer>
Market Vally © 2026
</footer>

<script>

/* a7b6caffe9bd44c69add2d1faeb27988 */
const API_KEY = "a7b6caffe9bd44c69add2d1faeb27988;


async function loadNews(topic){

  const newsBox = document.getElementById("news");

  newsBox.innerHTML =
  '<p class="loading">Latest news load ho rahi hai...</p>';

  try{

    const url =
    "https://newsapi.org/v2/everything?q=" +
    encodeURIComponent(topic) +
    "&language=en&sortBy=publishedAt&pageSize=10&apiKey=" +
    API_KEY;

    const response = await fetch(url);

    const data = await response.json();

    if(data.status !== "ok"){
      newsBox.innerHTML =
      "<p>News API error: " +
      (data.message || "Unknown error") +
      "</p>";
      return;
    }

    if(!data.articles || data.articles.length === 0){
      newsBox.innerHTML =
      "<p>Is category ki news nahi mili.</p>";
      return;
    }

    newsBox.innerHTML = "";

    data.articles.forEach(article => {

      const div = document.createElement("div");
      div.className = "news";

      div.innerHTML = `
        <a href="${article.url}" target="_blank">
          ${article.title}
        </a>
        <p>
          ${article.source?.name || ""}
          • ${article.publishedAt ?
          new Date(article.publishedAt).toLocaleString() : ""}
        </p>
      `;

      newsBox.appendChild(div);

    });

  }catch(error){

    newsBox.innerHTML =
    "<p>Internet/API connection problem.</p>";

  }
}


/* Page open hote hi India news */
loadNews("India");

</script>

</body>
</html>
